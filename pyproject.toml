[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoinfo"
version = "0.1.0"
description = "Automated crypto trading information system with security harness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
cryptoinfo = "cryptoinfo.cli:demo"

[tool.setuptools.packages.find]
where = ["src"]
